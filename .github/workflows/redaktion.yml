# Schreibt jeden Morgen die neue Ausgabe von The Daily Good und veröffentlicht sie über GitHub Pages.
name: Tagesausgabe

on:
  # GitHub verschiebt oder verwirft geplante Läufe bei hoher Last. Deshalb mehrere Termine:
  # Der erste erfolgreiche Lauf schreibt die Ausgabe, die späteren beenden sich sofort (--skip-if-exists).
  # Zeiten in UTC. Die Läufe starten seit Oktober 2026 meist fünf bis sechs Stunden zu spät, daher die Termine
  # kurz nach Mitternacht deutscher Zeit. 22:05 UTC ist im Winter noch der Vortag und beendet sich dann sofort.
  schedule:
    - cron: "5 22 * * *"
    - cron: "5 23 * * *"
    - cron: "30 0 * * *"
    - cron: "30 1 * * *"
    - cron: "30 2 * * *"
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redaktion
  cancel-in-progress: false

jobs:
  ausgabe:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # neuester Stand, damit ein wartender Lauf die gerade geschriebene Ausgabe sieht

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Claude Code, damit die Anfragen über Mircos Claude-Abo laufen (Token aus `claude setup-token`)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code

      # Nur Form und Länge des Tokens, nie der Wert
      - name: Abo-Token prüfen
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python3 -c "import os; t = os.environ.get('CLAUDE_CODE_OAUTH_TOKEN', ''); c = ''.join(t.split()); print('Länge', len(t), 'ohne Leerraum', len(c), 'Form ok' if c.startswith('sk-ant-oat') else 'unerwartete Form')"
          claude --version

      - name: Ausgabe schreiben
        env:
          # Ist das Abo-Token gesetzt, nutzt das Skript nur das Abo. Der API-Key ist nur noch Reserve.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TZ: Europe/Berlin
        # Der nächtliche Lauf überspringt sich, wenn es die Ausgabe schon gibt (z. B. nach einem Lauf von Hand)
        run: python redaktion.py ${{ github.event_name == 'schedule' && '--skip-if-exists' || '' }}

      - name: Veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state
          git commit -m "Ausgabe $(TZ=Europe/Berlin date +%F)" || echo "Keine Änderungen"
          git pull --rebase
          git push
