# Schreibt jeden Morgen die neue Ausgabe von The Daily Good und veröffentlicht sie über GitHub Pages.
name: Tagesausgabe

on:
  # GitHub verschiebt oder verwirft geplante Läufe bei hoher Last. Deshalb mehrere Termine:
  # Der erste erfolgreiche Lauf schreibt die Ausgabe, die späteren beenden sich sofort (--skip-if-exists).
  # Zeiten in UTC: 4:30, 5:15, 6:00 und 6:45 Uhr Sommerzeit (im Winter eine Stunde früher)
  schedule:
    - cron: "30 2 * * *"
    - cron: "15 3 * * *"
    - cron: "0 4 * * *"
    - cron: "45 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redaktion
  cancel-in-progress: false

jobs:
  ausgabe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # neuester Stand, damit ein wartender Lauf die gerade geschriebene Ausgabe sieht

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ausgabe schreiben
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TZ: Europe/Berlin
        # Der nächtliche Lauf überspringt sich, wenn es die Ausgabe schon gibt (z. B. nach einem Lauf von Hand)
        run: python redaktion.py ${{ github.event_name == 'schedule' && '--skip-if-exists' || '' }}

      - name: Veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state
          git commit -m "Ausgabe $(TZ=Europe/Berlin date +%F)" || echo "Keine Änderungen"
          git pull --rebase
          git push
